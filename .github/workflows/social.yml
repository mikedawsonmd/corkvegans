# Posts newly published stories to the Facebook Page and Instagram.
#
# Runs when:
#   - "Deploy site" finishes successfully (Instagram fetches the image from
#     the live site, so the story must be deployed first),
#   - manually: Actions → "Post stories to social media" → "Run workflow"
#     (choose "Dry run" to see what would be posted without posting).
#
# Only stories with the "Post to Facebook and Instagram" section added in
# Pages CMS are posted, each platform once. Successes are recorded in
# data/social-posted.json, which this workflow commits back to main.
# Setup and secrets: docs/social-publishing.md.

name: Post stories to social media

on:
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show what would be posted, post nothing"
        type: boolean
        default: true
      force:
        description: "Dry run only: preview this story (its file name without .md) as if ticked"
        type: string
        default: ""

permissions:
  contents: write # to commit data/social-posted.json

# One run at a time, so a story can never be posted twice by overlapping runs.
concurrency:
  group: social-posting
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # After a deploy, use exactly the commit that deploy published, so the
      # captions here always match the images Instagram fetches from the live
      # site. (Using the newest commit could run ahead of the site.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The stories come from the deployed commit (above), but the record of
      # what's already been posted must always be the newest one on main, so
      # re-runs and overlapping runs can never post a story twice.
      - name: Use the latest record of posts
        run: |
          git fetch --no-tags origin main
          git show origin/main:data/social-posted.json > data/social-posted.json

      - name: Post to Facebook and Instagram
        run: node scripts/post-social.ts
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || '' }}

      # Runs even if one platform failed, so successful posts are never
      # forgotten (and never repeated). The record is saved on top of the
      # latest main, whichever commit the stories were read from.
      - name: Record successful posts
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          cp data/social-posted.json "$RUNNER_TEMP/social-posted.json"
          git fetch --no-tags origin main
          git checkout --force -B save-record origin/main
          cp "$RUNNER_TEMP/social-posted.json" data/social-posted.json
          if git diff --quiet -- data/social-posted.json; then
            echo "No new posts to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-posted.json
          git commit -m "Record social media posts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
