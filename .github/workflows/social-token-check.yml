# Checks once a week that the Meta token used for social posting still
# works, so a broken or expiring token shows up as a failed run (and GitHub
# emails you) before a story fails to post. It only reads; nothing is posted.
#
# Runs when:
#   - every Monday morning,
#   - manually: Actions → "Check social media token" → "Run workflow".
#
# What it checks, and how to fix a failure: docs/social-publishing.md, 1.5.

name: Check social media token

on:
  schedule:
    - cron: "23 8 * * 1" # Mondays 08:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the Meta token
        run: node scripts/check-social-token.ts
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
