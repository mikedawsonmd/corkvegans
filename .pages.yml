# Pages CMS configuration — https://pagescms.org/docs/configuration/
#
# Editors open https://app.pagescms.org, choose this repository, and edit
# stories in a visual editor. Every save is a commit to this repository,
# which triggers the "Deploy site" GitHub Action.
#
# Only stories and story images are exposed here on purpose: editors cannot
# change site settings, membership settings or code through the CMS.

media:
  - name: stories
    label: Story images
    input: src/assets/stories
    output: /src/assets/stories
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: stories
    label: Stories
    type: collection
    path: src/content/stories
    format: yaml-frontmatter
    subfolders: false
    exclude: [README.md, .gitkeep]
    filename:
      # The web address is made from the title when the story is first created
      # and never changes afterwards, so shared links keep working. The
      # filename box is hidden: editing it by hand (e.g. dropping ".md") makes
      # saves fail with 'Invalid extension ""'.
      template: "{primary}.md"
      field: false
    view:
      primary: title
      fields: [title, category, publishedAt, draft]
      sort: [publishedAt, title]
      search: [title, description, author]
      default:
        sort: publishedAt
        order: desc
    commit:
      templates:
        create: "Create story {filename} (via Pages CMS by {userName})"
        update: "Update story {filename} (via Pages CMS by {userName})"
        delete: "Delete story {filename} (via Pages CMS by {userName})"
        rename: "Rename story {oldFilename} to {newFilename} (via Pages CMS by {userName})"
    fields:
      - name: draft
        label: "Draft: hidden from the website (untick to publish)"
        type: boolean
        default: true
        description: "Untick and save to publish. The story goes live on corkvegans.ie a few minutes later. Guest contributors: leave this ticked and tell an organiser your story is ready. Drafts are hidden from the website, but anyone looking at the public GitHub repository can see them."

      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120

      - name: description
        label: Short summary
        type: text
        required: true
        description: "One or two sentences. Shown on story cards and in link previews on WhatsApp, Facebook, LinkedIn, etc."
        options:
          maxlength: 300

      - name: category
        label: Category
        type: select
        required: true
        default: Stories
        options:
          values: [Community, News, Reviews, Events, Guides, Stories]

      - name: author
        label: Author
        type: string
        default: Cork Vegans
        description: "Your name, or leave as Cork Vegans."
        options:
          maxlength: 80

      - name: publishedAt
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: updatedAt
        label: Last updated (optional)
        type: date
        default: ""
        description: "Only set this if you make a significant change after publishing."
        options:
          format: yyyy-MM-dd

      - name: featuredImage
        label: Featured image
        type: image
        required: true
        description: "Landscape photo, ideally 1200 × 630 pixels or larger. It's also used for Facebook, Instagram and email, so every story needs one. JPG, PNG or WebP."
        options:
          media: stories
          extensions: [jpg, jpeg, png, webp]

      - name: featuredImageAlt
        label: Image description (alt text)
        type: string
        required: true
        description: "Describe the photo for people who can't see it, e.g. \"Three people sharing a vegan pizza at a long table\"."
        options:
          maxlength: 200

      - name: imageFocus
        label: Keep which part of the photo when cropping?
        type: select
        default: centre
        description: "Social media and email crop the photo (wide for Facebook and email, tall for Instagram). Choose the part that must stay in view, e.g. Top for faces near the top. For screenshots, flyers or anything with text, choose Whole photo so nothing is cut off."
        options:
          values:
            - { name: top, label: Top }
            - { name: centre, label: Centre }
            - { name: bottom, label: Bottom }
            - { name: whole, label: "Whole photo (adds a green border)" }

      - name: body
        label: Story
        type: rich-text
        options:
          format: markdown
          media: stories
          switcher: false

      # ── Posting to Facebook and Instagram ──
      # Pages CMS can't show fields conditionally, so this is a list of at most
      # one item: nothing shows until an editor clicks Add, and adding it is the
      # decision to post. Removing it means the story isn't posted.
      - name: social
        label: Post to Facebook and Instagram
        type: object
        description: "To post this story to our Facebook Page and Instagram, click Add. It's posted once, a few minutes after the story is published. Leave this empty to not post. Please check with an organiser first."
        list:
          max: 1
        fields:
          - name: summary
            label: Post text (optional)
            type: text
            description: "1–3 sentences for Facebook and the email newsletter. Plain text, no links. Leave empty to use the short summary."
            options:
              maxlength: 300
              pattern:
                regex: "^(?![\\s\\S]*(https?://|www\\.))[\\s\\S]*$"
                message: "Please leave out links. We add the link to the story automatically."

          - name: igCaption
            label: Instagram caption (optional)
            type: text
            description: "Leave empty to use the post text. \"Full story at the link in our bio.\" is added at the end automatically."
            options:
              maxlength: 2000

          - name: image
            label: Different photo (optional)
            type: image
            description: "Use a different photo for Facebook, Instagram and email. Leave empty to use the featured image. For screenshots or flyers, set the crop above to Whole photo."
            options:
              media: stories
              extensions: [jpg, jpeg, png, webp]

settings:
  commit:
    identity: user
