# Pages CMS configuration — https://pagescms.org/docs/configuration/
#
# Editors open https://app.pagescms.org, choose this repository, and edit
# stories in a visual editor. Every save is a commit to this repository,
# which triggers the "Deploy site" GitHub Action.
#
# Only stories and story images are exposed here on purpose: editors cannot
# change site settings, donation links or code through the CMS.

media:
  - name: stories
    label: Story images
    input: src/assets/stories
    output: /src/assets/stories
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: stories
    label: Stories
    type: collection
    path: src/content/stories
    format: yaml-frontmatter
    subfolders: false
    exclude: [README.md, .gitkeep]
    filename:
      # The web address is made from the title when the story is first created
      # and never changes afterwards, so shared links keep working. The
      # filename box is hidden: editing it by hand (e.g. dropping ".md") makes
      # saves fail with 'Invalid extension ""'.
      template: "{primary}.md"
      field: false
    view:
      primary: title
      fields: [title, category, publishedAt, draft]
      sort: [publishedAt, title]
      search: [title, description, author]
      default:
        sort: publishedAt
        order: desc
    commit:
      templates:
        create: "Create story {filename} (via Pages CMS by {userName})"
        update: "Update story {filename} (via Pages CMS by {userName})"
        delete: "Delete story {filename} (via Pages CMS by {userName})"
        rename: "Rename story {oldFilename} to {newFilename} (via Pages CMS by {userName})"
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120

      - name: description
        label: Short summary
        type: text
        required: true
        description: "One or two sentences. Shown on story cards and in link previews on WhatsApp, Facebook, LinkedIn, etc."
        options:
          maxlength: 300

      - name: category
        label: Category
        type: select
        required: true
        default: Stories
        options:
          values: [Community, News, Reviews, Events, Guides, Stories]

      - name: author
        label: Author
        type: string
        default: Cork Vegans
        description: "Your name, or leave as Cork Vegans."
        options:
          maxlength: 80

      - name: publishedAt
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: updatedAt
        label: Last updated (optional)
        type: date
        default: ""
        description: "Only set this if you make a significant change after publishing."
        options:
          format: yyyy-MM-dd

      - name: featuredImage
        label: Featured image
        type: image
        required: true
        description: "Landscape photo, ideally 1200 × 630 pixels or larger. It's also used for Facebook, Instagram and email, so every story needs one. JPG, PNG or WebP."
        options:
          media: stories
          extensions: [jpg, jpeg, png, webp]

      - name: featuredImageAlt
        label: Image description (alt text)
        type: string
        required: true
        description: "Describe the photo for people who can't see it, e.g. \"Three people sharing a vegan pizza at a long table\"."
        options:
          maxlength: 200

      - name: imageFocus
        label: Keep which part of the photo when cropping?
        type: select
        default: centre
        description: "Social media and email crop the photo (wide for Facebook and email, tall for Instagram). Choose the part that must stay in view, e.g. Top for faces near the top."
        options:
          values:
            - { name: top, label: Top }
            - { name: centre, label: Centre }
            - { name: bottom, label: Bottom }

      - name: draft
        label: "Draft — hidden from the website (untick to publish)"
        type: boolean
        default: true
        description: "Guest contributors: leave this ticked and tell an organiser your story is ready. They'll review it and publish. While ticked, the story doesn't appear on corkvegans.ie, but drafts are still visible to anyone who looks at the public GitHub repository."

      - name: body
        label: Story
        type: rich-text
        options:
          format: markdown
          media: stories
          switcher: false

      # ── Sharing: social media and the email newsletter (all optional) ──
      - name: summary
        label: "Sharing: summary (optional)"
        type: text
        description: "1–3 sentences for Facebook, Instagram and the email newsletter. Plain text, no links. Leave empty to use the short summary above."
        options:
          maxlength: 300
          pattern:
            regex: "^(?![\\s\\S]*(https?://|www\\.))[\\s\\S]*$"
            message: "Please leave out links. We add the link to the story automatically."

      - name: socialImage
        label: "Sharing: different photo (optional)"
        type: image
        description: "Use a different photo for social media and email. Leave empty to use the featured image."
        options:
          media: stories
          extensions: [jpg, jpeg, png, webp]

      - name: igCaption
        label: "Sharing: Instagram caption (optional)"
        type: text
        description: "Leave empty to use the sharing summary. \"Full story at the link in our bio.\" is added at the end automatically."
        options:
          maxlength: 2000

      - name: publishSocial
        label: "Sharing: post to Facebook and Instagram"
        type: boolean
        default: false
        description: "Tick to post this story to our Facebook Page and Instagram once it's published (Draft unticked). It's only ever posted once. Ask an organiser before ticking this."

settings:
  commit:
    identity: user
