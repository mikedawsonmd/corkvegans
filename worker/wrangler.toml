# Membership Worker. Deploy from this folder: npx wrangler deploy
# Endpoint: https://corkvegans-membership.<your-subdomain>.workers.dev
# Setup, secrets and variables: docs/ADMIN-GUIDE.md, "Membership".
name = "corkvegans-membership"
main = "index.js"
compatibility_date = "2026-10-01"

# The /membership/ routes answer 404 unless PAYMENTS_ENABLED is "true". Set it
# (and the other secrets) with: npx wrangler secret put PAYMENTS_ENABLED

# Mondays 06:17 UTC: one read-only Brevo call, because Brevo deletes an API
# key after 90 days without use (welcome-email.js, keepBrevoKeyAlive).
[triggers]
crons = ["17 6 * * 1"]

[vars]
MEMBER_DISCOUNT_EUR = "5"
MEMBER_CODE_GRACE_DAYS = "3"
EVENTBRITE_TIME_ZONE = "Europe/Dublin"
EMAIL_REPLY_TO = "crkvgns@gmail.com"

# Per-IP limits. If you merge membership.js into another Worker, copy these
# blocks into its config.
[[ratelimits]]
name = "MEMBERSHIP_RATE_LIMITER" # checkout sessions (card-testing protection)
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CODE_RATE_LIMITER" # the thank-you screen fetching the new code
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LOOKUP_RATE_LIMITER" # "Lost your code?"
namespace_id = "1003"
simple = { limit = 3, period = 60 }
